<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping list</title>
<!-- 1. Load the iavica SDK before the app's own script. -->
<script src="https://iavica.com/sdk/v1/iavica.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f5f2;color:#1d1b18}
  main{max-width:520px;margin:0 auto;padding:24px 16px}
  h1{font-size:1.5rem;margin:0 0 4px}
  #status{color:#6b645d;font-size:.9rem;margin:0 0 16px}
  form{display:flex;gap:8px;margin-bottom:16px}
  form input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid #ddd5cc;border-radius:10px;background:#fff}
  li input{width:18px;height:18px;margin:0;accent-color:#1d1b18}
  button{font:inherit;padding:10px 14px;border:0;border-radius:10px;background:#1d1b18;color:#fff;cursor:pointer}
  button:disabled{opacity:.5}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;background:#fff;border:1px solid #e6e0da;border-radius:10px}
  li label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
  li.done span{text-decoration:line-through;color:#8a8279}
  li button{background:none;color:#b42318;padding:4px 8px}
  .msg{padding:10px 12px;border-radius:10px;background:#fdecea;color:#b42318;margin-bottom:12px}
  .hidden{display:none}
  footer{max-width:520px;margin:0 auto;padding:8px 16px 32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:#6b645d}
  footer a{color:#e8421a}
  footer button{background:none;color:#1d1b18;border:1px solid #ddd5cc;padding:6px 10px;font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>🛒 Shopping list</h1>
  <p id="status">Connecting…</p>
  <div id="err" class="msg hidden"></div>
  <form id="add">
    <input id="name" placeholder="Add an item (e.g. milk)" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <p id="invite" class="hidden"><button type="button" id="bInvite">Share this list with someone</button></p>
</main>
<!-- 2. Footer in the app's language: a link to iavica and a way to log out. -->
<footer>
  <span>Persistent data with <a href="https://iavica.com" target="_blank" rel="noopener">iavica</a></span>
  <button type="button" id="logout">Log out</button>
</footer>
<script>
// iavica: this appId links the app to the user's saved data. Never change it, and never
// rename saved fields or collections without migrating them: https://iavica.com/ai#data-model
const db = Iavica.connect({
  appId: 'f7e5d271-fbdb-4580-ae1c-6289159c10c7', // a fixed UUID v4: if you copy this app to make your own, ask your AI for a new one
  appName: 'Shopping list',
  locale: 'en'
});
const items = db.collection('items'); // each record: { name, done }
let all = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 3. Errors the app must handle: 409 (changed on another device), 429 (too many requests).
function showError(err) {
  console.error(err);
  let text = 'Something went wrong. Please try again.';
  if (err && err.status === 409) text = 'This item changed on another device. The list has been refreshed: try again.';
  if (err && err.status === 429) text = 'Too many changes in a row. Wait a few seconds and try again.';
  $('err').textContent = text;
  $('err').classList.remove('hidden');
  setTimeout(() => $('err').classList.add('hidden'), 6000);
  if (err && err.status === 409) load().catch(() => {});
}

async function load() {
  all = await items.listAll(); // the whole collection; the SDK follows every page
  all.sort((a, b) => Number(a.data.done) - Number(b.data.done) || a.data.name.localeCompare(b.data.name));
  $('list').innerHTML = all.length
    ? all.map((r) => `<li class="${r.data.done ? 'done' : ''}">
        <label><input type="checkbox" data-toggle="${r.id}" ${r.data.done ? 'checked' : ''}><span>${esc(r.data.name)}</span></label>
        <button type="button" data-remove="${r.id}" aria-label="Remove">✕</button></li>`).join('')
    : '<li>Your list is empty.</li>';
}

$('add').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (!name) return;
  try {
    await items.add({ name, done: false });
    $('name').value = '';
    await load();
  } catch (err) { showError(err); }
});

$('list').addEventListener('click', async (e) => {
  const id = e.target.dataset.toggle || e.target.dataset.remove;
  const r = all.find((x) => x.id === id);
  if (!r) return;
  try {
    // Every write sends the record's version: a change made meanwhile on another device is never overwritten.
    if (e.target.dataset.toggle) await items.update(r.id, { ...r.data, done: e.target.checked }, { version: r.version });
    else await items.remove(r.id, { version: r.version });
    await load();
  } catch (err) { showError(err); }
});

// 4. Sharing: only the owner can invite. Invited people share the same list.
$('bInvite').addEventListener('click', async () => {
  const email = prompt('Email of the person you want to share the list with:');
  if (!email) return;
  try {
    await db.invite(email.trim());
    alert('Invitation sent to ' + email.trim() + '.');
  } catch (err) { showError(err); }
});

$('logout').addEventListener('click', async () => { await db.logout(); location.reload(); });

// 5. Classic scripts cannot use top-level await: wrap the start-up.
(async () => {
  try {
    await db.ready(); // the first time, iavica asks for the email and sends an approval link
    $('status').textContent = 'Saved with iavica. Open it on any device with the same email.';
    if (db.getRole() === 'owner') $('invite').classList.remove('hidden');
    await load();
  } catch (err) {
    $('status').textContent = 'Not connected.';
    showError(err);
  }
})();
</script>
</body>
</html>
